# /etc/nginx/sites-available/mcphub  (symlink into sites-enabled)

limit_req_zone $binary_remote_addr zone=mcphub:10m rate=20r/s;

server {
    listen 80;
    server_name mcp.[YOUR_DOMAIN];
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.[YOUR_DOMAIN];

    ssl_certificate     /etc/letsencrypt/live/mcp.[YOUR_DOMAIN]/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.[YOUR_DOMAIN]/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 1m;

    # Health endpoints are for local monitoring only.
    location /health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5080;
    }

    # OAuth discovery document (public information).
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
    }

    # The MCP endpoint (Streamable HTTP; responses may stream, so buffering must be off).
    location = /mcp {
        limit_req zone=mcphub burst=40 nodelay;

        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else: not exposed.
    location / {
        return 404;
    }
}
